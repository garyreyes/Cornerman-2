name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Pinned explicitly: the npm bundled with actions/setup-node's Node 24
      # has, at points, disagreed with a locally-generated lockfile over
      # `overrides`-injected packages (npm error EUSAGE "Missing: X from
      # lock file") even when `npm ci` succeeds locally against the exact
      # same lockfile -- a known class of npm version-to-version drift in
      # how lockfileVersion 3 records override resolutions, not a real
      # package.json/package-lock.json mismatch.
      - run: npm install -g npm@11.6.2

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
